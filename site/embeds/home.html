<!--
  =====================================================================
  OneDash Marketing Site — Webflow Embed loader v4  (home)
  =====================================================================
  WHAT: Paste this ONCE into a Webflow "Embed" element on the home
        page. It never needs to change again. CSS, content AND page
        behaviour (home.js) all load from GitHub raw (live within 5 min
        of a push, no cache purging); images/PDF load from jsDelivr,
        which is also the fallback if GitHub raw is unreachable. CSS is
        applied BEFORE content is injected, so the page never renders
        unstyled.

  v4: page JS moved out of this file into site/assets/home.js so it
      follows the branch toggle too. Nothing interactive needs a
      re-paste any more — push home.js and republish is not required.
  =====================================================================
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<div id="od-root" class="od-embed"></div>

<script>
  (function () {
    var PAGE = "home";
    // ── Branch toggle — comment/uncomment the active block, then publish ──
    // MAIN (production — live for real visitors):
    // var RAW = "https://raw.githubusercontent.com/samrezonedash/onedashengine-user-guide-assets/main/site/assets/";
    // var CDN = "https://cdn.jsdelivr.net/gh/samrezonedash/onedashengine-user-guide-assets@main/site/assets/";
    // PRELIVE (testing). To preview WIP changes: comment out the two MAIN
    // lines above, uncomment these two, then publish (to this page only,
    // or the whole site — either is fine, this only affects this page):
    var RAW = "https://raw.githubusercontent.com/samrezonedash/onedashengine-user-guide-assets/prelive/site/assets/";
    var CDN = "https://cdn.jsdelivr.net/gh/samrezonedash/onedashengine-user-guide-assets@prelive/site/assets/";
    var root = document.getElementById('od-root');

    function fetchText(path) {
      return fetch(RAW + path).then(function (r) {
        if (!r.ok) throw new Error('raw ' + r.status);
        return r.text();
      }).catch(function () {
        return fetch(CDN + path).then(function (r) {
          if (!r.ok) throw new Error('cdn ' + r.status);
          return r.text();
        });
      });
    }

    // Page behaviour is optional: a page with no .js file still renders.
    function fetchOptional(path) {
      return fetchText(path).catch(function () { return ''; });
    }

    Promise.all([
      fetchText('marketing.css'),
      fetchText('content/' + PAGE + '.html'),
      fetchOptional(PAGE + '.js')
    ])
      .then(function (results) {
        // CSS first — content must never render with only Webflow's own
        // site-wide stylesheet (its bare p/li/h1/.container rules produce
        // the centered/column-broken layout this loader exists to avoid).
        var style = document.createElement('style');
        style.textContent = results[0];
        document.head.appendChild(style);

        root.innerHTML = results[1];
        root.querySelectorAll('[data-od]').forEach(function (el) { el.src = CDN + el.getAttribute('data-od'); });
        root.querySelectorAll('[data-od-href]').forEach(function (el) { el.href = CDN + el.getAttribute('data-od-href'); });

        // Content landed async, so a #hash from a cross-page link missed
        // the browser's one-shot scroll-on-load; do it once content exists.
        if (window.location.hash) {
          var hashTarget = root.querySelector(window.location.hash);
          if (hashTarget) { hashTarget.scrollIntoView(); }
        }

        // Run the page's behaviour last, with the content already in the
        // DOM. innerHTML never executes <script>, so this is injected as a
        // real script element instead. A failure here must not take the
        // page down — the content is already rendered and readable.
        if (results[2]) {
          try {
            window.OD = { root: root, CDN: CDN, RAW: RAW, PAGE: PAGE };
            var s = document.createElement('script');
            s.textContent = results[2];
            document.body.appendChild(s);
          } catch (e) {
            if (window.console) { console.error('OneDash: page script failed', e); }
          }
        }
      });
  })();
</script>
